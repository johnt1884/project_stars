<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shortcuts - Modular</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="app" class="main-container">
        <header class="top-bar">
            <div class="top-bar-left" id="top-bar-left">
                <!-- Navigation and main actions will go here -->
            </div>
            <div class="top-bar-right" id="top-bar-right">
                <!-- Secondary actions will go here -->
            </div>
        </header>
        <main class="main-content">
            <div id="content-area">
                <div id="thumbnail-container">
                    <!-- Projects and thumbnails will be rendered here -->
                </div>
                <aside id="categories-panel">
                    <div id="panel-resizer"></div>
                    <div id="panel-content"></div>
                </aside>
            </div>
        </main>
    </div>
    <!-- Modals will be added here in later stages -->

    <!-- Core Infrastructure -->
    <script src="js/config.js"></script>
    <script src="js/events.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/fs-adapter.js"></script>
    <script src="js/state.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/persistence.js"></script>
    <script src="js/discovery.js"></script>
    <script src="js/shortcuts.js"></script>
    <script src="js/categories.js"></script>
    <script src="js/sorting.js"></script>
    <script src="js/thumbnail-engine.js"></script>
    <script src="js/components/navigation.js"></script>
    <script src="js/components/size-manager.js"></script>
    <script src="js/components/row-action-bar.js"></script>
    <script src="js/components/video-player.js"></script>
    <script src="js/components/categories-panel.js"></script>
    <script src="js/components/category-menu.js"></script>
    <script src="js/components/video-editor.js"></script>
    <script src="js/components/script-generator.js"></script>

    <!-- Application Entry Point -->
    <script src="js/app.js"></script>
</body>
</html>
