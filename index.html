<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shortcuts - Modular</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="main-container">
        <div class="main-content">
            <!-- Top Toolbar -->
            <header class="top-bar">
                <div class="top-bar-left">
                    <!-- Load Menu -->
                    <div id="load-menu-container" class="load-menu-container">
                        <button id="load-menu-btn" class="bar-button" title="Load">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                        </button>
                        <div id="load-dropdown" class="dropdown-content">
                            <button id="load-directory-btn">Load all videos</button>
                            <button id="load-latest-videos-btn">Load new videos</button>
                            <button id="load-sc-btn">Load all shortcuts</button>
                            <button id="load-root-sc-btn">Load root shortcut directory</button>
                            <button id="create-playlist-load-btn">Create playlist</button>
                            <button id="create-playlist-root-load-btn">Create playlist root</button>
                            <button id="update-playlist-root-load-btn">Update playlist root</button>
                        </div>
                    </div>

                    <div id="options-menu-container" class="load-menu-container">
                        <button id="options-menu-btn" class="bar-button" title="Options">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        </button>
                        <div id="options-dropdown" class="dropdown-content" style="min-width: 450px;">
                            <!-- Content will be injected by component -->
                        </div>
                    </div>

                    <div id="info-menu-container" class="load-menu-container">
                        <button id="info-menu-btn" class="bar-button" title="Information">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                        </button>
                        <div id="info-dropdown" class="dropdown-content" style="min-width: 350px; padding: 15px; box-sizing: border-box;">
                            <!-- Content will be injected by component -->
                        </div>
                    </div>

                    <!-- Size Selectors -->
                    <select id="h-size-selector" class="toolbar-select" title="Horizontal Thumbnail Size">
                        <option value="auto">H Auto</option>
                        <option value="custom" selected>H Custom</option>
                    </select>

                    <select id="v-size-selector" class="toolbar-select" title="Vertical Thumbnail Size">
                        <option value="auto">V Auto</option>
                        <option value="0.85" selected>V 85%</option>
                        <option value="custom">V Custom</option>
                    </select>

                    <input type="number" id="custom-size-input" class="toolbar-input" placeholder="%" min="1" max="500" value="150">

                    <!-- Sort -->
                    <select id="sort-selector" class="toolbar-select">
                        <option value="" disabled selected hidden>Sort</option>
                        <option value="name-asc">Name (A-Z)</option>
                        <option value="name-desc">Name (Z-A)</option>
                        <option value="date-new">Date (Newest)</option>
                        <option value="date-old">Date (Oldest)</option>
                    </select>

                    <!-- Navigation -->
                    <div class="nav-group">
                        <button id="prev-canvas-btn" class="bar-button">&lt;</button>
                        <select id="canvas-select" class="toolbar-select"></select>
                        <button id="next-canvas-btn" class="bar-button">&gt;</button>
                        <select id="group-selector" class="toolbar-select"></select>
                    </div>

                    <!-- Toggles -->
                    <div class="checkbox-container">
                        <input type="checkbox" id="show-dates-checkbox">
                        <label for="show-dates-checkbox">Show Dates</label>
                    </div>

                    <div class="checkbox-container">
                        <input type="checkbox" id="show-numbers-checkbox">
                        <label for="show-numbers-checkbox">Show Numbers</label>
                    </div>

                    <div class="checkbox-container">
                        <input type="checkbox" id="enable-categories-panel-checkbox">
                        <label for="enable-categories-panel-checkbox">Categories</label>
                    </div>

                    <button id="top-categories-menu-btn" class="bar-button" title="Categories">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
                    </button>

                    <div class="checkbox-container">
                        <input type="checkbox" id="preserve-original-size-global-checkbox">
                        <label for="preserve-original-size-global-checkbox">Preserve Original Size</label>
                    </div>
                </div>

                <div class="top-bar-right">
                    <button id="shortcut-script-btn" class="bar-button">Generate Action Script</button>
                    <button id="create-playlist-btn" class="bar-button" style="display: none;">Create Playlist</button>
                    <button id="delete-shortcuts-btn" class="bar-button" style="display: none;">Delete Selected Shortcuts</button>
                </div>
            </header>

            <main id="content-area">
                <div id="thumbnail-container">
                    <div id="content-spacer"></div>
                </div>
                <aside id="categories-panel">
                    <div id="panel-resizer"></div>
                    <div id="panel-content"></div>
                </aside>
            </main>
        </div>
    </div>

    <!-- Application Bootstrap -->
    <script src="js/events.js"></script>
    <script src="js/state.js"></script>
    <script src="js/persistence.js"></script>
    <script src="js/fs-adapter.js"></script>
    <script src="js/discovery.js"></script>
    <script src="js/components/action-toolbar.js"></script>
    <script src="js/components/load-menu.js"></script>
    <script src="js/components/options-menu.js"></script>
    <script src="js/components/info-menu.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
